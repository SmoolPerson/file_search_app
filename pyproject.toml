[tool.setuptools]
packages = []

[project]
name = "griptape-nodes-ai-graph-search"
version = "0.1.0"
description = "A Streamlit app for AI Graph Search."
authors = [
    { name = "Griptape", email = "team@griptape.ai" },
    { name = "SmoolPerson", email = "noemail4privacy@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.41.0",
    "griptape-nodes",
    "fastapi[standard]>=0.115.12",
    "httpx>=0.28.0,<1.0.0",
    "cattrs>=26.1.0",
    "griptape>=1.9.4",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "typos>=1.26.0",
    "watchdog>=6.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "TD002",
    "FIX002",
    "D101",
    "D102",
    "D107",
    "D105",
    "ANN002",
    "ANN003",
    "ANN401",
    "COM812",
    "E501",
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "D104",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.uv.sources]
griptape-nodes = { path = "./griptape-nodes", editable = true }

[tool.typos]
[tool.typos.default.extend-words]

[tool.typos.files]
extend-exclude = []

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
